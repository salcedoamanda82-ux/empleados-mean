<div class="container mt-4">
  <div class="row">
    <!-- Formulario -->
    <div class="col-md-5">
      <div class="card">
        <div class="card-body">
          <form #empleadoForm="ngForm" (ngSubmit)="addEmpleado(empleadoForm)">
            <input type="hidden" name="_id" [(ngModel)]="empleadoService.selectedEmpleado._id">
            
            <div class="mb-3">
              <input type="text" name="nombres" [(ngModel)]="empleadoService.selectedEmpleado.nombres" placeholder="Nombres" class="form-control" required>
            </div>
            <div class="mb-3">
              <input type="text" name="apellidos" [(ngModel)]="empleadoService.selectedEmpleado.apellidos" placeholder="Apellidos" class="form-control" required>
            </div>
            <div class="mb-3">
              <input type="text" name="cargo" [(ngModel)]="empleadoService.selectedEmpleado.cargo" placeholder="Cargo" class="form-control" required>
            </div>
            <div class="mb-3">
              <input type="text" name="area" [(ngModel)]="empleadoService.selectedEmpleado.area" placeholder="area" class="form-control" required>
            </div>
            <div class="mb-3">
              <input type="number" name="salario" [(ngModel)]="empleadoService.selectedEmpleado.salario" placeholder="Salario" class="form-control" required>
            </div>
            <div class="mb-3">
              <input type="email" name="email" [(ngModel)]="empleadoService.selectedEmpleado.email" placeholder="Email" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100 mb-2" type="submit">Guardar</button>
            <button class="btn btn-secondary w-100" type="button" (click)="resetForm(empleadoForm)">Limpiar</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="col-md-7">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nombres</th>
            <th>Cargo</th>
            <th>Salario</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (emp of empleadoService.empleados; track emp._id) {
            <tr>
              <td>{{ emp.nombres }} {{ emp.apellidos }}</td>
              <td>{{ emp.cargo }}</td>
              <td>{{ emp.salario }}</td>
              <td>
                <button class="btn btn-secondary btn-sm me-1" (click)="editEmpleado(emp)">Editar</button>
                <button class="btn btn-danger btn-sm" (click)="deleteEmpleado(emp._id!, empleadoForm)">Eliminar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
